<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Helvetica, Arial, sans-serif">
  <title>VCE cost: exact O(G u^3) vs Hutchinson O(u^3 + G Z u^2)</title>
  <!-- frame -->
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">Variance-component cost vs unknowns u</text>
  <text x="320" y="46" text-anchor="middle" font-size="12" fill="#555">log&#8211;log, fixed groups G and probes Z (here G=8, Z=2000)</text>
  <!-- plot area 70,70 .. 600,340 -->
  <rect x="70" y="70" width="530" height="270" fill="#fbfbfb" stroke="#ccc"/>
  <!-- axes labels -->
  <text x="335" y="378" text-anchor="middle" font-size="13" fill="#000">unknowns u  (10 &#8594; 10,000)</text>
  <text x="24" y="205" text-anchor="middle" font-size="13" fill="#000" transform="rotate(-90 24 205)">relative flops</text>
  <!-- gridlines (decades on x) -->
  <g stroke="#e6e6e6" stroke-width="1">
    <line x1="70"  y1="70" x2="70"  y2="340"/>
    <line x1="247" y1="70" x2="247" y2="340"/>
    <line x1="423" y1="70" x2="423" y2="340"/>
    <line x1="600" y1="70" x2="600" y2="340"/>
  </g>
  <g font-size="11" fill="#777" text-anchor="middle">
    <text x="70"  y="355">10</text>
    <text x="247" y="355">100</text>
    <text x="423" y="355">1,000</text>
    <text x="600" y="355">10,000</text>
  </g>
  <!-- map: x = 70 + 530*xn ; y = 70 + 270*yn  (yn already 1 at bottom-cost) -->
  <!-- EXACT curve  O(G u^3): straight line in log-log, steeper (slope 3) -->
  <polyline fill="none" stroke="#c0392b" stroke-width="2.5"
    points="70,70 102,86 134,103 166,121 198,138 230,155 262,172 294,189 326,207 359,224 391,241 423,258 455,275 487,288 519,312 551,326 621,346"/>
  <!-- HUTCHINSON curve O(u^3 + G Z u^2): starts higher (the +u^3 & GZu^2 offset), slope ~2 then 3 -->
  <polyline fill="none" stroke="#1f7a3d" stroke-width="2.5"
    points="70,271 102,260 134,249 166,238 198,227 230,217 262,206 294,195 326,184 359,173 391,162 423,151 455,140 487,128 519,116 551,105 621,92"/>
  <!-- crossover marker at u~Z (xn=0.767 -> x=70+530*0.767=476) -->
  <line x1="476" y1="70" x2="476" y2="340" stroke="#4a90d9" stroke-width="1.3" stroke-dasharray="5 4"/>
  <circle cx="476" cy="279" r="4.5" fill="#4a90d9"/>
  <text x="476" y="62" text-anchor="middle" font-size="11" fill="#4a90d9">crossover  u &#8776; Z</text>
  <!-- region labels -->
  <text x="250" y="120" font-size="12" fill="#c0392b" font-weight="bold">exact cheaper</text>
  <text x="250" y="136" font-size="11" fill="#555">(also gives r&#8341;, snooping)</text>
  <text x="500" y="320" font-size="12" fill="#1f7a3d" font-weight="bold">Hutchinson cheaper</text>
  <text x="500" y="336" font-size="11" fill="#555">(matrix-free, r_g only)</text>
  <!-- legend -->
  <g font-size="12">
    <line x1="88" y1="90" x2="118" y2="90" stroke="#c0392b" stroke-width="2.5"/>
    <text x="124" y="94" fill="#000">exact  &#8776; G&#183;u&#179;</text>
    <line x1="88" y1="108" x2="118" y2="108" stroke="#1f7a3d" stroke-width="2.5"/>
    <text x="124" y="112" fill="#000">Hutchinson  &#8776; u&#179; + G&#183;Z&#183;u&#178;</text>
  </g>
</svg>
