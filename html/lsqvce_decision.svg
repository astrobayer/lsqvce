<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="700" height="560" font-family="Helvetica, Arial, sans-serif">
  <title>lsqvce engine decision flowchart</title>
  <rect x="0" y="0" width="700" height="560" fill="#ffffff"/>
  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="bold">Which lsqvce engine, and which VCE backend?</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <g font-size="12.5">

  <!-- Q1: one parameter block? -->
  <polygon points="350,50 470,90 350,130 230,90" fill="#eaf3fb" stroke="#4a90d9"/>
  <text x="350" y="86" text-anchor="middle">Do all obs share ONE</text>
  <text x="350" y="102" text-anchor="middle">parameter block?</text>

  <!-- yes -> Q2 known noise -->
  <line x1="470" y1="90" x2="560" y2="90" stroke="#555" marker-end="url(#arrow)"/>
  <text x="500" y="82" font-size="11" fill="#1f7a3d">yes</text>
  <polygon points="600,50 660,90 600,130 540,90" fill="#eaf3fb" stroke="#4a90d9"/>
  <text x="600" y="86" text-anchor="middle" font-size="11">noise model</text>
  <text x="600" y="101" text-anchor="middle" font-size="11">known?</text>

  <!-- Q2 yes -> adjust -->
  <line x1="600" y1="130" x2="600" y2="165" stroke="#555" marker-end="url(#arrow)"/>
  <text x="610" y="150" font-size="11" fill="#1f7a3d">yes</text>
  <rect x="530" y="165" width="140" height="46" rx="5" fill="#fff4e5" stroke="#e8912d"/>
  <text x="600" y="185" text-anchor="middle" font-weight="bold">lsqvce.adjust</text>
  <text x="600" y="201" text-anchor="middle" font-size="11">flat, in-memory</text>

  <!-- Q1 no -> Q3 must discover? (down-left) -->
  <line x1="350" y1="130" x2="350" y2="180" stroke="#555" marker-end="url(#arrow)"/>
  <text x="360" y="152" font-size="11" fill="#c0392b">no (common + locals)</text>
  <polygon points="350,180 480,222 350,264 220,222" fill="#eaf3fb" stroke="#4a90d9"/>
  <text x="350" y="216" text-anchor="middle">Must you DISCOVER the</text>
  <text x="350" y="232" text-anchor="middle">noise model (unknown</text>
  <text x="350" y="248" text-anchor="middle">sigma / colour)?</text>

  <!-- Q3 no -> adjustBlock -->
  <line x1="220" y1="222" x2="150" y2="222" stroke="#555" marker-end="url(#arrow)"/>
  <text x="165" y="214" font-size="11" fill="#1f7a3d">no</text>
  <rect x="20" y="199" width="130" height="46" rx="5" fill="#fff4e5" stroke="#e8912d"/>
  <text x="85" y="219" text-anchor="middle" font-weight="bold" font-size="12">lsqvce.engine.adjustBlock</text>
  <text x="85" y="235" text-anchor="middle" font-size="11">block-arrow, 1 solve</text>

  <!-- Q3 yes -> adjustVCE -->
  <line x1="350" y1="264" x2="350" y2="300" stroke="#555" marker-end="url(#arrow)"/>
  <text x="360" y="285" font-size="11" fill="#c0392b">yes</text>
  <rect x="270" y="300" width="160" height="52" rx="5" fill="#fff4e5" stroke="#e8912d"/>
  <text x="350" y="321" text-anchor="middle" font-weight="bold">lsqvce.adjustVCE</text>
  <text x="350" y="337" text-anchor="middle" font-size="11">SHAPE + SCALE loop</text>

  <!-- Q2 no -> also adjustVCE (must discover the noise) -->
  <path d="M540,90 L500,90 C450,90 450,326 432,326" fill="none" stroke="#555" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="455" y="84" font-size="11" fill="#c0392b">no &#8594; discover it</text>

  <!-- VCE backend sub-decision -->
  <line x1="350" y1="352" x2="350" y2="392" stroke="#555" marker-end="url(#arrow)"/>
  <text x="490" y="376" text-anchor="end" font-size="11" fill="#555">need variance components &#8594;</text>
  <polygon points="350,392 490,432 350,472 210,432" fill="#eaf3fb" stroke="#4a90d9"/>
  <text x="350" y="428" text-anchor="middle">Common unknowns u</text>
  <text x="350" y="444" text-anchor="middle">in the THOUSANDS?</text>

  <!-- backend: exact -->
  <line x1="210" y1="432" x2="140" y2="432" stroke="#555" marker-end="url(#arrow)"/>
  <text x="158" y="424" font-size="11" fill="#1f7a3d">no</text>
  <rect x="10" y="409" width="130" height="60" rx="5" fill="#eafaf0" stroke="#1f7a3d"/>
  <text x="75" y="429" text-anchor="middle" font-weight="bold" font-size="11">exact varComp</text>
  <text x="75" y="445" text-anchor="middle" font-size="10.5">O(G&#183;u&#179;), gives r&#8341;,</text>
  <text x="75" y="459" text-anchor="middle" font-size="10.5">snooping, reliability</text>

  <!-- backend: hutchinson -->
  <line x1="490" y1="432" x2="560" y2="432" stroke="#555" marker-end="url(#arrow)"/>
  <text x="512" y="424" font-size="11" fill="#c0392b">yes</text>
  <rect x="560" y="405" width="132" height="68" rx="5" fill="#fdecea" stroke="#c0392b"/>
  <text x="626" y="424" text-anchor="middle" font-weight="bold" font-size="10.5">vceHutchinson</text>
  <text x="626" y="438" text-anchor="middle" font-size="9.5">or backend=hutchinson</text>
  <text x="626" y="452" text-anchor="middle" font-size="9.5">O(u&#179;+G&#183;Z&#183;u&#178;),</text>
  <text x="626" y="465" text-anchor="middle" font-size="9.5">matrix-free, r_g only</text>

  <!-- footnote -->
  <text x="350" y="510" text-anchor="middle" font-size="11" fill="#777">Hutchinson is a real substitution on the FLAT varComp path today; the</text>
  <text x="350" y="526" text-anchor="middle" font-size="11" fill="#777">block-arrow variant (vce / Combine.varComp) is on the roadmap.</text>
  </g>
</svg>
