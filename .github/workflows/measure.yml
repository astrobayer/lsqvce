# lsqvce measurements - tier A on the self-hosted runner, NOT a gate.
# A measurement script under dev/validation/ runs once in MATLAB; its log and
# its diary file are the record (an artifact, never committed: measurement
# output stays out of the public repository). The numbers that matter are
# copied into HANDOVER by hand, with this run's URL.
# Triggered by a pull request that touches a measurement script or this file,
# or by hand. ci.yml and its gate are untouched by it.
name: lsqvce measure

on:
  pull_request:
    paths:
      - 'dev/validation/*.m'
      - '.github/workflows/measure.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: "auto | a8 | hosted - narrows the routing, never widens it"
        required: false
        default: auto

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Where may MATLAB run for this event: A8, a GitHub-hosted runner, or
  # nowhere? One decision for the whole organisation, in
  # astrobayer/ci-actions (ci-route; docs/CI_GUIDE.md section 2): members
  # only, no forks, A8 from a public repository only for the allow-listed
  # user. This job never fails - a refusal arrives in the MATLAB job as
  # runner=none and matlab-setup turns that required context red.
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      runner: ${{ steps.route.outputs.runner }}
      runs-on: ${{ steps.route.outputs.runs-on }}
      reason: ${{ steps.route.outputs.reason }}
    steps:
      - id: route
        uses: astrobayer/ci-actions/ci-route@v1.4.0
        with:
          policy: ${{ vars.CI_MATLAB_RUNNER }}
          request: ${{ github.event.inputs.runner }}

  measure:
    # A8-only and optional: skipped (not failed) when the route refuses.
    if: needs.route.outputs.runner == 'a8'
    needs: [route]
    runs-on: ${{ fromJSON(needs.route.outputs.runs-on) }}
    timeout-minutes: 60
    env:
      LSQVCE_CI: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # MATLAB on the routed runner: probed on A8, installed by setup-matlab on a
      # GitHub-hosted runner (public repositories only), or a red step quoting
      # the routing refusal. Replaces matlab-probe; same immutable-tag rule.
      - uses: astrobayer/ci-actions/matlab-setup@v1.4.0
        timeout-minutes: 15
        with:
          runner: ${{ needs.route.outputs.runner }}
          reason: ${{ needs.route.outputs.reason }}
          products: ${{ vars.CI_MATLAB_PRODUCTS }}
      - uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: cd('dev/validation'); wp156_acceptance_measure('wp156_acceptance_measure.txt')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: wp156_acceptance_measure, path: dev/validation/wp156_acceptance_measure.txt }
