# lsqvce CI - the D8 gate (HANDOVER.md §5 WP-30, D2 reference).
# Hosted variant ONLY (public repo => matlab-actions licenses MATLAB free).
# The MATLAB release is PINNED to the user's local R2026a - the local run
# has been the ground truth, so CI must match it, not "latest".
# Checks `audit` + `matlab` are the branch-protection requirements on main.
name: lsqvce CI

on:
  push:
    branches: [main]   # the post-merge run on main (the DONE evidence)
  pull_request:        # ONE run per dev push, on the MERGE PREVIEW commit.
                       # User decision 2026-08-19: the previous push-on-all-
                       # branches + pull_request pair ran everything TWICE
                       # once a PR existed (doubled MathWorks downloads and
                       # parallel cache saves - the duplicate-key incident).
                       # The D8 loop now opens a DRAFT PR right after the
                       # first push, so every push still gets its verdict.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:                       # < 1 min, no MATLAB: fail fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy
      - run: sudo apt-get install -y -qq pandoc   # the Manual check (audit 23) rebuilds html/lsqvce_manual.html
      - run: python dev/docs_src/audit_tree.py
      - run: python dev/docs_src/audit_selftest.py   # R5 M0: every new check must fire on its fault
      - run: for f in dev/validation/v10review.py; do python "$f"; done

  matlab:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 45        # backstop: no wedge sits for hours
    env:
      LSQVCE_CI: 1             # ci_gate: skip pool suites (printed in the
                               # log), cap pools at 2, headless figures
    steps:
      - uses: actions/checkout@v6
      # setup-matlab wedges (cache restore OR fresh download hanging >30 min)
      # hit three sessions running (2026-08-18/19, incident runbook in
      # HANDOVER §5 WP-30/§9 WP-32). Self-heal (user decision 2026-08-19):
      # each attempt dies at 12 min instead of hanging, and a wedged first
      # attempt gets ONE automatic in-job retry -- only two wedges in a row
      # turn the job red. The check name stays `matlab` (branch protection
      # untouched).
      - uses: matlab-actions/setup-matlab@v3
        id: mlsetup1
        continue-on-error: true
        timeout-minutes: 12
        with:
          release: R2026a      # == the user's local release (pinned)
          cache: true          # cache the MATLAB install between runs
                               # (user decision 2026-08-18: cuts the ~5 min
                               # setup to seconds after the first run)
      - uses: matlab-actions/setup-matlab@v3
        if: steps.mlsetup1.outcome != 'success'
        timeout-minutes: 12
        with:
          release: R2026a
          cache: true
          # products: Parallel_Computing_Toolbox   # lift the test_parallel
          #   skip in dev/tests/ci_gate.m in the SAME commit that enables this.
      - uses: matlab-actions/run-command@v3
        with:
          command: cd('dev/tests'); ci_gate
      - uses: actions/upload-artifact@v4
        if: always()           # the log is wanted MOST when the run is red
        with: { name: run_all_log, path: dev/tests/last_run_all.txt }
